# Ergo IRC server. Single replica: its datastore (accounts, channel registrations) is a
# file on the PVC, and Ergo takes a lock on it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ergo-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ergo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ergo
  template:
    metadata:
      labels:
        app: ergo
    spec:
      containers:
        - name: ergo
          image: ergo
          command: [sh, -c]
          # mkcerts makes a self-signed cert for :6697 on first start only (it exits non-zero
          # if one already exists, which would crash-loop every restart); overlays can mount
          # a real one over /ircd/fullchain.pem + /ircd/privkey.pem instead.
          args:
            - cd /ircd && { [ -f /ircd/fullchain.pem ] || /ircd-bin/ergo mkcerts --conf /config/ircd.yaml --quiet; } && exec /ircd-bin/ergo run --conf /config/ircd.yaml
          ports:
            - name: irc
              containerPort: 6667
            - name: ircs
              containerPort: 6697
          readinessProbe:
            tcpSocket:
              port: irc
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: irc
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /ircd
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ergo-data
        - name: config
          configMap:
            name: ergo-config
---
apiVersion: v1
kind: Service
metadata:
  name: ergo
spec:
  selector:
    app: ergo
  ports:
    - name: irc
      port: 6667
      targetPort: irc
    - name: ircs
      port: 6697
      targetPort: ircs
